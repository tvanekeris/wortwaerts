<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Wortwärts: deutsche Alltagssätze zum Hören und Nachsprechen, mit einstellbarem Tempo – zum Üben bei Aphasie.">
<title>Wortwärts – Alltagssätze zum Hören</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Literata:opsz,wght@7..72,400;7..72,500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: eine Spalte – 1 Stimme, 2 Tempo, 3 Satzlänge, 4 Thema, dann großer Play-Knopf, Aufdecken, Neuer Satz */
  :root {
    --bg: #eef1f4;
    --surface: #ffffff;
    --ink: #17202b;
    --muted: #5d6877;
    --line: #d6dce3;
    --accent: #1f5f8b;
    --accent-ink: #ffffff;
    --mark: #f2c14e;
    --mark-soft: #fbf0d2;
    --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --font-body: "Literata", Georgia, "Times New Roman", serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161d; --surface: #19212b; --ink: #e8edf2; --muted: #98a4b3; --line: #2a3542;
      --accent: #6fb0e0; --accent-ink: #0d1620; --mark: #e2b443; --mark-soft: #2c2716;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161d; --surface: #19212b; --ink: #e8edf2; --muted: #98a4b3; --line: #2a3542;
    --accent: #6fb0e0; --accent-ink: #0d1620; --mark: #e2b443; --mark-soft: #2c2716;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: var(--font-body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 56px;
  }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 22px; }

  header { display: grid; gap: 6px; }
  h1 {
    font-family: var(--font-display); font-weight: 800; font-size: clamp(30px, 6vw, 44px);
    line-height: 1.05; margin: 0; letter-spacing: -.01em;
  }

  .schritt {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px 18px 18px; display: grid; gap: 12px; margin: 0; min-width: 0;
  }
  .schritt-titel {
    font-family: var(--font-display); font-weight: 600; font-size: 19px; padding: 0;
    display: flex; align-items: center; gap: 10px;
  }
  .schritt-nr {
    display: inline-grid; place-items: center; width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: 15px; font-weight: 800;
  }
  button:focus-visible, input:focus-visible + span, input[type="range"]:focus-visible {
    outline: 3px solid var(--mark); outline-offset: 3px;
  }

  /* Stimme und Satzlänge: Schieber mit zwei Stellungen (Radio-Knöpfe, der Knopf gleitet zur gewählten Seite) */
  .schieber {
    position: relative; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 4px;
  }
  .schieber::before {
    content: ""; position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px);
    border-radius: 999px; background: var(--accent); transition: transform .2s ease;
  }
  .schieber:has(label:last-child input:checked)::before { transform: translateX(100%); }
  .schieber label { position: relative; }
  .schieber input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .schieber span {
    position: relative; display: flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 52px; border-radius: 999px; cursor: pointer;
    font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--muted);
    transition: color .2s ease;
  }
  .schieber input:checked + span { color: var(--accent-ink); }

  /* Tempo: natives <input type="range"> mit drei Rasterstufen, gestaltet wie der Stimmen-Schieber.
     Der Knopf ist ein Drittel so breit wie die Bahn, so liegt er bei jeder Stufe genau
     unter deren Beschriftung (Breite über Container-Einheiten). */
  .regler { position: relative; container-type: inline-size; }
  .regler input[type="range"] {
    -webkit-appearance: none; appearance: none; display: block; box-sizing: border-box;
    width: 100%; height: 62px; margin: 0; padding: 4px; cursor: pointer;
    background: var(--bg); border: 1px solid var(--line); border-radius: 999px;
  }
  .regler input[type="range"]::-webkit-slider-runnable-track {
    height: 52px; background: transparent; border: 0; border-radius: 999px;
  }
  .regler input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: calc((100cqw - 10px) / 3); height: 52px; border: 0; border-radius: 999px;
    background: var(--accent); cursor: grab;
  }
  .regler input[type="range"]::-moz-range-track {
    height: 52px; background: transparent; border: 0; border-radius: 999px;
  }
  .regler input[type="range"]::-moz-range-thumb {
    width: calc((100cqw - 10px) / 3); height: 52px; border: 0; border-radius: 999px;
    background: var(--accent); cursor: grab;
  }
  .stufen {
    position: absolute; inset: 5px; display: grid; grid-template-columns: repeat(3, 1fr);
    align-items: center; pointer-events: none;
    font-family: var(--font-display); font-weight: 600; font-size: 19px; color: var(--muted);
  }
  .stufen span { text-align: center; }
  .stufen span.an { color: var(--accent-ink); }

  /* Themen: Kacheln mit Symbol und Beschriftung */
  .themen { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .thema {
    display: grid; justify-items: center; align-content: start; gap: 8px;
    min-height: 112px; padding: 14px 8px 12px; border-radius: 14px; cursor: pointer;
    background: var(--bg); color: var(--ink); border: 2px solid var(--line);
    font-family: var(--font-display); font-weight: 600; font-size: 16px; line-height: 1.2;
    text-align: center;
  }
  .thema svg {
    width: 40px; height: 40px; fill: none; stroke: var(--accent); stroke-width: 1.8;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .thema.alle { grid-column: span 2; }
  .thema:hover { border-color: var(--accent); }
  .thema[aria-pressed="true"] { background: var(--mark-soft); border-color: var(--mark); }

  /* Hören */
  .hoeren { display: grid; justify-items: center; gap: 14px; padding: 8px 0; }
  .play {
    width: 148px; height: 148px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; align-content: center; gap: 4px;
    font-family: var(--font-display); font-weight: 600; font-size: 18px;
    box-shadow: 0 6px 18px rgb(0 0 0 / .18);
  }
  .play svg { width: 56px; height: 56px; fill: currentColor; }
  .play:hover:not(:disabled) { filter: brightness(1.08); }
  .play:disabled { opacity: .4; cursor: default; box-shadow: none; }
  .play.spielt { background: var(--mark); color: #17202b; }

  .knopf {
    width: min(100%, 360px); min-height: 56px; border-radius: 999px; cursor: pointer;
    font-family: var(--font-display); font-weight: 600; font-size: 18px;
    display: inline-flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--surface); color: var(--ink); border: 2px solid var(--line);
  }
  .knopf svg {
    width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
  }
  .knopf:hover:not(:disabled) { border-color: var(--accent); }
  .knopf:disabled { opacity: .4; cursor: default; }
  .knopf.neu { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

  .satz {
    width: 100%; margin: 0; padding: 18px 20px; border-radius: 14px; text-align: center;
    background: var(--mark-soft); border: 2px solid var(--mark);
    font-size: clamp(22px, 5vw, 28px); line-height: 1.35; font-weight: 500;
  }

  .note {
    margin: 0; font-size: 16px; line-height: 1.5; color: var(--ink);
    background: var(--mark-soft); border-radius: 10px; padding: 10px 14px;
  }

  @media (prefers-reduced-motion: reduce) {
    .schieber::before, .schieber span { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Wortwärts</h1>
  </header>

  <noscript>
    <p class="note">Diese Seite braucht JavaScript, um die Sätze abzuspielen. Bitte schalte JavaScript in deinem Browser ein und lade die Seite neu.</p>
  </noscript>

  <fieldset class="schritt">
    <legend class="schritt-titel"><span class="schritt-nr">1</span> Stimme</legend>
    <div class="schieber" id="stimme">

      <label><input type="radio" name="stimme" value="mann"><span>Mann</span></label>
    </div>
  </fieldset>

  <fieldset class="schritt tempo">
    <legend class="schritt-titel"><span class="schritt-nr">2</span> Tempo</legend>
    <div class="regler">
      <input type="range" id="tempo" min="0" max="2" step="1" value="0" aria-label="Tempo">
      <div class="stufen" id="stufen" aria-hidden="true">
        <span>langsam</span>
        <span>mittel</span>
        <span>normal</span>
      </div>
    </div>
  </fieldset>

  <fieldset class="schritt">
    <legend class="schritt-titel"><span class="schritt-nr">3</span> Satzlänge</legend>
    <div class="schieber" id="laenge">
      <label><input type="radio" name="laenge" value="kurz"><span>kurze Sätze</span></label>
      <label><input type="radio" name="laenge" value="lang"><span>lange Sätze</span></label>
    </div>
  </fieldset>

  <fieldset class="schritt">
    <legend class="schritt-titel"><span class="schritt-nr">4</span> Thema</legend>
    <div class="themen" id="themen"></div>
  </fieldset>

  <section class="hoeren" aria-label="Hören">
    <button class="play" id="play" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true" id="play-icon"><path d="M7 4.5v15l13-7.5z"/></svg>
      <span id="play-label">Abspielen</span>
    </button>

    <button class="knopf" id="aufdecken" type="button" disabled aria-expanded="false" aria-controls="satz">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
      <span id="aufdecken-label">Satz aufdecken</span>
    </button>
    <p class="satz" id="satz" hidden aria-live="polite"></p>

    <button class="knopf neu" id="neu" type="button" disabled>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h3c4 0 6 10 10 10h3M17 14l3 3-3 3M4 17h3c1.5 0 2.6-1.4 3.6-3.2M13.4 10.2C14.4 8.4 15.5 7 17 7h3M17 4l3 3-3 3"/></svg>
      <span>Neuer Satz</span>
    </button>
  </section>

  <p class="note" id="note" hidden></p>
</div>

  const TEMPI = DATEN.tempi;            // ["0.5", "0.7", "1.0"]
  const ALLE = "alle";

  // Symbole zu den Themen (Strichzeichnungen, 24×24)
  const SYMBOLE = {
    [ALLE]: '<path d="M4 7h3c4 0 6 10 10 10h3M17 14l3 3-3 3M4 17h3c1.5 0 2.6-1.4 3.6-3.2M13.4 10.2C14.4 8.4 15.5 7 17 7h3M17 4l3 3-3 3"/>',
    "Begrüßung & Smalltalk": '<path d="M4 5h16v11H10l-5 4v-4H4z"/><path d="M8.5 10.5h.01M12 10.5h.01M15.5 10.5h.01"/>',

    "Einkaufen": '<path d="M2.5 4h2.5l2.4 11h10.4l2.2-8H6"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',
    "Unterwegs": '<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10.5h14"/><path d="M8.5 13.8h.01M15.5 13.8h.01"/><path d="M7.5 17v3M16.5 17v3"/>',
    "Arbeit & Termine": '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M7.5 14h3M7.5 17.5h6"/>',

    "Freizeit & Verabredungen": '<path d="M3 7h18v3a2 2 0 0 0 0 4v3H3v-3a2 2 0 0 0 0-4z"/><path d="M15 7v10" stroke-dasharray="2 2"/>',
    "Verständigung & Höflichkeit": '<path d="M3 4h12v8H8l-3.5 3V12H3z"/><path d="M18 9h3v8h-1.5v3L16 17H10v-2"/>',

    "Körperpflege & Anziehen": '<path d="M8.5 3.5 3 6.5l2 4 2.5-1.2V20.5h9V9.3l2.5 1.2 2-4-5.5-3a3.5 3.5 0 0 1-7 0z"/>',
    "Gefühle & Bedürfnisse": '<circle cx="12" cy="12" r="9"/><path d="M9 10h.01M15 10h.01"/><path d="M8.5 14.5a4.5 4.5 0 0 0 7 0"/>',
    "Hilfe & Notfall": '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><path d="M5.6 5.6l3.6 3.6M14.8 14.8l3.6 3.6M18.4 5.6l-3.6 3.6M9.2 14.8l-3.6 3.6"/>',
    "Therapie & Reha": '<path d="M6.5 6.5v11M17.5 6.5v11M3.5 9v6M20.5 9v6M6.5 12h11"/>',
  };
  const SYMBOL_ERSATZ = SYMBOLE["Begrüßung & Smalltalk"];

  const themenBox = document.getElementById("themen");
  const tempoIn = document.getElementById("tempo");
  const stufen = document.querySelectorAll("#stufen span");
  const stimmeRadios = document.querySelectorAll('input[name="stimme"]');
  const laengeRadios = document.querySelectorAll('input[name="laenge"]');
  const playBtn = document.getElementById("play");
  const playIcon = document.getElementById("play-icon");
  const playLabel = document.getElementById("play-label");
  const aufdeckenBtn = document.getElementById("aufdecken");
  const aufdeckenLabel = document.getElementById("aufdecken-label");
  const satzBox = document.getElementById("satz");
  const neuBtn = document.getElementById("neu");
  const note = document.getElementById("note");

  const ICON_PLAY = '<path d="M7 4.5v15l13-7.5z"/>';
  const ICON_STOP = '<path d="M6.5 6.5h11v11h-11z"/>';
  const TEMPO_TEXT = ["langsam", "mittel", "normal"];

  // ---- Einstellungen merken (nur Komfort, Seite funktioniert auch ohne) ----
  function lies(k) { try { return localStorage.getItem("wortwaerts-" + k); } catch { return null; } }
  function merke(k, v) { try { localStorage.setItem("wortwaerts-" + k, v); } catch {} }

  let stimme = lies("stimme") === "mann" ? "mann" : "frau";
  let tempoStufe = ["0", "1", "2"].includes(lies("tempo")) ? Number(lies("tempo")) : 0;
  let laenge = lies("laenge") === "lang" ? "lang" : "kurz";
  let thema = null;       // ALLE oder Index in DATEN.themen
  let stapel = [];        // gemischte, noch nicht gespielte Sätze des Themas
  let satz = null;        // aktueller Satz {nr, de}

  // ---- Stimme ----
  stimmeRadios.forEach(r => {
    r.checked = r.value === stimme;
    r.addEventListener("change", () => { if (r.checked) { stimme = r.value; merke("stimme", stimme); } });
  });

  // ---- Satzlänge: wechselt zu einem Satz der neuen Länge (vorgeladen, nicht abgespielt) ----
  laengeRadios.forEach(r => {
    r.checked = r.value === laenge;
    r.addEventListener("change", () => {
      if (!r.checked) return;
      laenge = r.value;
      merke("laenge", laenge);
      if (thema !== null) waehleThema(thema, false);
    });
  });

  // ---- Tempo ----
  function zeigeTempo() {
    tempoIn.value = String(tempoStufe);
    tempoIn.setAttribute("aria-valuetext", TEMPO_TEXT[tempoStufe]);
    stufen.forEach((s, i) => s.classList.toggle("an", i === tempoStufe));
  }
  tempoIn.addEventListener("input", () => { tempoStufe = Number(tempoIn.value); merke("tempo", tempoStufe); zeigeTempo(); });
  zeigeTempo();

  // ---- Themen ----
  const themenKnoepfe = [];
  function themaKnopf(wert, name) {
    const b = document.createElement("button");
    b.type = "button";
    b.className = wert === ALLE ? "thema alle" : "thema";
    b.setAttribute("aria-pressed", "false");
    b.innerHTML = `<svg viewBox="0 0 24 24" aria-hidden="true">${SYMBOLE[name] || SYMBOL_ERSATZ}</svg><span></span>`;
    b.querySelector("span").textContent = wert === ALLE ? "Alle Themen" : name;
    b.addEventListener("click", () => waehleThema(wert, true));
    themenBox.appendChild(b);
    themenKnoepfe.push([wert, b]);
  }
  themaKnopf(ALLE, ALLE);
  DATEN.themen.forEach((t, i) => themaKnopf(i, t.name));

  function mische(liste) {
    const a = liste.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function saetzeDesThemas() {
    return thema === ALLE ? DATEN.themen.flatMap(t => t[laenge]) : DATEN.themen[thema][laenge];
  }

  function naechsterSatz() {
    if (!stapel.length) {
      stapel = mische(saetzeDesThemas());
      // nicht denselben Satz zweimal hintereinander
      if (stapel.length > 1 && stapel[0] === satz) stapel.push(stapel.shift());
    }
    satz = stapel.shift();
    verdecke();
  }

  function waehleThema(wert, abspielen) {
    thema = wert;
    themenKnoepfe.forEach(([w, b]) => b.setAttribute("aria-pressed", String(w === wert)));
    stapel = [];
    naechsterSatz();
    playBtn.disabled = aufdeckenBtn.disabled = neuBtn.disabled = false;
    if (abspielen) {
      spiele();
      // auf dem Handy liegt der Play-Knopf unter den Themen: dorthin scrollen
      const ruhig = matchMedia("(prefers-reduced-motion: reduce)").matches;
      document.querySelector(".hoeren").scrollIntoView({ block: "nearest", behavior: ruhig ? "auto" : "smooth" });
    } else {
      // nur vorladen, damit der erste Tipp auf Abspielen sofort klingt
      stoppe();
      audio.src = aufnahme();
      audio.load();
    }
  }

  // ---- Aufdecken ----
  function verdecke() {
    satzBox.hidden = true;
    satzBox.textContent = "";
    aufdeckenLabel.textContent = "Satz aufdecken";
    aufdeckenBtn.setAttribute("aria-expanded", "false");
  }
  aufdeckenBtn.addEventListener("click", () => {
    if (!satz) return;
    if (satzBox.hidden) {
      satzBox.textContent = satz.de;
      satzBox.hidden = false;
      aufdeckenLabel.textContent = "Satz verdecken";
      aufdeckenBtn.setAttribute("aria-expanded", "true");
    } else {
      verdecke();
    }
  });

  neuBtn.addEventListener("click", () => { if (thema !== null) { naechsterSatz(); spiele(); } });

  // ---- Audioausgabe wach halten ----
  // Viele Geräte (Bluetooth, HDMI, Energiesparmodus der Soundkarte) schalten die Ausgabe in
  // Pausen ab und blenden beim nächsten Ton erst ein – das verschluckt das erste Wort.
  // Ein unhörbares Dauersignal (20 Hz, -80 dB) hält die Ausgabe offen, solange geübt wird.
  const AUFWACH_MS = 400;          // Wartezeit, bis eine gerade geweckte Ausgabe bereit ist
  const WACH_NACHLAUF_MS = 60000;  // so lange bleibt die Ausgabe nach dem letzten Satz wach
  let wachCtx = null;
  let schlafTimer = null;

  // Weckt die Ausgabe; liefert, wie lange vor dem Satz gewartet werden sollte.
  function weckeAusgabe() {
    clearTimeout(schlafTimer);
    try {
      if (!wachCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return 0;
        wachCtx = new Ctx();
        const ton = wachCtx.createOscillator();
        const leise = wachCtx.createGain();
        ton.frequency.value = 20;
        leise.gain.value = 0.0001;
        ton.connect(leise).connect(wachCtx.destination);
        ton.start();
        return AUFWACH_MS;
      }
      if (wachCtx.state !== "running") { wachCtx.resume(); return AUFWACH_MS; }
    } catch {}
    return 0;
  }

  function ausgabeSchlafenLegen() {
    clearTimeout(schlafTimer);
    schlafTimer = setTimeout(() => {
      if (wachCtx && audio.paused) wachCtx.suspend().catch(() => {});
    }, WACH_NACHLAUF_MS);
  }

  // ---- Wiedergabe ----
  const audio = new Audio();
  audio.preload = "auto";
  let startTimer = null;

  function aufnahme() {
    return `audio/${satz.ordner}/${stimme}/${TEMPI[tempoStufe]}/${satz.nr}.mp3`;
  }

  function zeigeSpielt(an) {
    playBtn.classList.toggle("spielt", an);
    playIcon.innerHTML = an ? ICON_STOP : ICON_PLAY;
    playLabel.textContent = an ? "Stopp" : "Abspielen";
  }

  function stoppe() {
    clearTimeout(startTimer);
    audio.pause();
    zeigeSpielt(false);
    ausgabeSchlafenLegen();
  }

  function spiele() {
    if (!satz) return;
    stoppe();
    note.hidden = true;
    audio.src = aufnahme();
    zeigeSpielt(true);
    startTimer = setTimeout(() => {
      audio.play().catch(err => {
        if (err.name === "AbortError") return;
        zeigeSpielt(false);
        note.textContent = "Der Satz konnte nicht abgespielt werden. Drück noch einmal auf Abspielen.";
        note.hidden = false;
      });
    }, weckeAusgabe());
  }

  audio.addEventListener("ended", () => { zeigeSpielt(false); ausgabeSchlafenLegen(); });
  audio.addEventListener("error", () => {
    if (!audio.getAttribute("src")) return;
    clearTimeout(startTimer);
    zeigeSpielt(false);
    note.textContent = "Der Satz konnte nicht geladen werden. Prüf die Internetverbindung und drück noch einmal auf Abspielen.";
    note.hidden = false;
  });
  playBtn.addEventListener("click", () => {
    if (playBtn.classList.contains("spielt")) stoppe();
    else spiele();
  });

  // Beim Laden: „Alle Themen“ wählen und einen Zufallssatz vorladen
  // (ohne Abspielen – Browser erlauben Ton erst nach einem Tipp)
  waehleThema(ALLE, false);
</script>
